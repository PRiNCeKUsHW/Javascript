  <script>
    const tl = gsap.timeline({ paused: true });
    // reveal a code line like typing: clip opens one character at a time
    function typeLine(sel, at, chars) {
      tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: Math.min(0.5, chars * 0.022), ease: `steps(${chars})` }, at);
    }
    function pop(sel, at, from = 0.4) {
      tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.2)" }, at);
    }
    typeLine("#o-l0", 1.00, 27);

    typeLine("#o-l2", 1.50, 27);
    typeLine("#o-l3", 2.00, 10);
    typeLine("#o-l4", 2.80, 15);
    typeLine("#o-l5", 4.10, 18);
    typeLine("#o-l6", 4.60, 21);
    typeLine("#o-l7", 5.10, 9);
    typeLine("#o-l8", 5.55, 20);
    pop("#o-tag", 0.35, 0.6);
    // the tired clerk slides up behind his desk
    tl.fromTo("#o-clerk-wrap", { y: 420 }, { y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
    // one slow tally mark per vote, a ballot lands on the pile after each
    const marks = [5.4, 6.6, 7.8, 9.0, 10.2, 11.4];
    const armX = [-110, -90, -70, -50, -70, -8];
    tl.set(["#o-clerk-t1","#o-clerk-t2","#o-clerk-t3","#o-clerk-t4","#o-clerk-t5","#o-clerk-t6"], { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
    marks.forEach((m, i) => {
      const t = m - 3.3;
      tl.to("#o-clerk-arm", { x: armX[i], y: -16, duration: 0.25, ease: "power2.inOut" }, t - 0.25);
      tl.to("#o-clerk-arm", { y: 6, duration: 0.35, ease: "none" }, t);
      tl.fromTo("#o-clerk-t" + (i + 1), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.38, ease: "none" }, t);
      tl.to("#o-clerk-head", { rotation: i % 2 ? 3 : -3, transformOrigin: "50% 80%", duration: 0.3, ease: "sine.inOut" }, t);
      tl.fromTo("#o-p" + (i + 1), { y: -1450, rotation: (i % 2 ? 1 : -1) * 40, opacity: 1 },
        { y: 0, rotation: (i % 2 ? 1 : -1) * (6 + i), duration: 0.45, ease: "power2.in" }, t);
    });
    tl.set(["#o-p1","#o-p2","#o-p3","#o-p4","#o-p5","#o-p6"], { opacity: 0 }, 0);
    // sweat, then the six-line verdict
    tl.fromTo("#o-clerk-sweat", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.2 }, 9.2 - 3.3);
    tl.to("#o-clerk-sweat", { y: 40, opacity: 0, duration: 1.0, ease: "power1.in" }, 9.5 - 3.3);
    tl.fromTo("#o-bracket", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, 9.85 - 3.3);
    tl.fromTo("#o-stamp", { scale: 2.2, rotation: -16, opacity: 0 }, { scale: 1, rotation: -8, opacity: 1, duration: 0.28, ease: "power4.in" }, 9.75 - 3.3);
    tl.to("#o-stamp", { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 10.05 - 3.3);
    // the clerk nods off
    tl.to("#o-clerk-head", { rotation: 14, y: 10, transformOrigin: "50% 80%", duration: 0.6, ease: "power2.inOut" }, 12.0 - 3.3);
    tl.fromTo("#o-zzz", { opacity: 0, y: 20 }, { opacity: 1, y: -10, duration: 0.5, ease: "power2.out" }, 12.15 - 3.3);
