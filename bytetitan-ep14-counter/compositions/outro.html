  <script>
    const tl = gsap.timeline({ paused: true });
    // reveal a code line like typing: clip opens one character at a time
    function typeLine(sel, at, chars) {
      tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: Math.min(0.5, chars * 0.022), ease: `steps(${chars})` }, at);
    }
    function pop(sel, at, from = 0.4) {
      tl.fromTo(sel, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.2)" }, at);
    }

    tl.fromTo("#x-logo", { scale: 0, rotation: -90, opacity: 1 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.05);
    tl.fromTo("#x-word", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.25);
    
    for (let i = 0; i < 48; i++) {
      const t0 = 0.3 + ((i * 37) % 100) / 100 * 0.6;
      const drift = Math.sin(i * 1.7) * 90;
      tl.fromTo("#x-cf-" + i, { opacity: 0, y: -40, x: 0, rotation: (i * 47) % 360 },
        { opacity: 1, duration: 0.05, ease: "none" }, t0);
      tl.fromTo("#x-cf-" + i, { y: -40, x: 0, rotation: (i * 47) % 360, rotationX: 0 },
        { y: 860 + (i % 5) * 30, x: drift, rotation: (i * 47) % 360 + 540, rotationX: 720, duration: 2.4 + (i % 4) * 0.15, ease: "power1.in", immediateRender: false }, t0);
      tl.to("#x-cf-" + i, { opacity: 0, duration: 0.25, ease: "none" }, t0 + 2.4 + (i % 4) * 0.15 - 0.2);
    }
    tl.fromTo("#x-follow", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 0.80);
    tl.fromTo("#x-next", { y: 160, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 2.05);

    ["#x-c1", "#x-c2", "#x-c3", "#x-c4", "#x-c5"].forEach((id, i) => {
      tl.fromTo(id, { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 3.30 + i * 0.1);

    });
    
    for (let i = 0; i < 30; i++) {
      const t0 = 4.5 + ((i * 37) % 100) / 100 * 0.3;

    }
    tl.to("#x-logo", { scale: 1.1, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 4.60);
