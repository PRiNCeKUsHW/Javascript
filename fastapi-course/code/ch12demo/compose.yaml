services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  db:
    image: postgres:17
    environment: {POSTGRES_PASSWORD: "${DB_PASSWORD}", POSTGRES_DB: taskhub}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s}
  redis:
    image: redis:7
volumes:
  pgdata:
