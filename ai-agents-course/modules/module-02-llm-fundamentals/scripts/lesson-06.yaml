module_title: LLM Fundamentals and API Integration
title: "Project, Part 1: AI Study Assistant, Client, Costs and Explanations"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 2 · Lesson 6 · Project
    title: "Build the AI Study Assistant, part 1"
    subtitle: Plan the tool, build an offline-capable client, track costs, and stream explanations.
    loop: [Ask, Stream, Measure, Budget]
    say: >
      Project time! Do lessons mein hum AI Study Assistant banayenge. Ek command line tool, jo programming concepts explain karta hai, validated JSON mein quizzes banata hai, aur memory ke saath chat karta hai. Aur saath mein har ek cent ka hisaab rakhta hai.
      Iss module ki har cheez isme aayegi. Ek ek file karke, aaram se chalenge.

  - type: bullets
    chapter: What we are building
    heading: "The brief"
    items:
      - {text: "`explain`: stream an explanation at a chosen level", say: "Explain command kisi bhi topic ko stream karke samjhata hai, beginner, intermediate, ya advanced level par."}
      - {text: "`quiz`: multiple-choice questions as validated JSON; save and grade them", say: "Quiz command validated JSON mein multiple choice questions banata hai, jinhe aap save aur grade kar sakte ho."}
      - {text: "`chat`: a conversation with history, trimmed to a token budget", say: "Chat command history ke saath conversation karta hai, ek token budget ke andar trim karke."}
      - {text: "Every call reports tokens and cost; a budget stops runaway spending", say: "Har call apne tokens aur cost batati hai, aur ek budget faltu kharche ko rokta hai."}
      - {text: "Clear errors, automatic retries, and an offline mode for tests", say: "Aur clear errors, automatic retries, aur ek offline mode, taaki tests ko kabhi key ya network na chahiye."}

  - type: diagram
    chapter: Architecture
    heading: Architecture
    nodes:
      - {id: cli, label: cli.py, sub: commands & output, x: 864, y: 60, w: 340, h: 110, tone: amber, mono: true}
      - {id: assistant, label: assistant.py, sub: "explain · quiz · chat", x: 864, y: 280, w: 400, h: 120, tone: teal, mono: true}
      - {id: prompts, label: prompts.py, sub: system prompts, x: 240, y: 280, w: 300, h: 110, tone: violet, mono: true}
      - {id: models, label: models.py, sub: Quiz schema, x: 240, y: 470, w: 300, h: 110, tone: violet, mono: true}
      - {id: pricing, label: pricing.py, sub: costs & budget, x: 1490, y: 280, w: 300, h: 110, tone: blue, mono: true}
      - {id: client, label: client.py, sub: real or offline client, x: 864, y: 500, w: 400, h: 110, tone: blue, mono: true}
      - {id: api, label: Claude API, sub: needs a key, x: 1490, y: 600, w: 300, h: 100, tone: violet}
      - {id: fake, label: fake_api.py, sub: offline stand-in, x: 240, y: 640, w: 300, h: 100, tone: muted, mono: true}
    edges:
      - {from: cli, to: assistant}
      - {from: assistant, to: prompts}
      - {from: assistant, to: models}
      - {from: assistant, to: pricing}
      - {from: assistant, to: client}
      - {from: client, to: api, label: key set}
      - {from: client, to: fake, label: offline}
    say: >
      Code se pehle architecture. Har file ka ek hi kaam hai. Isse separation of concerns kehte hain.
    steps:
      - show: [cli, assistant, "cli->assistant"]
        focus: [cli, assistant]
        say: >
          Command line arguments aur printing sambhalti hai, aur assistant ko call karti hai. Assistant mein asli logic hai: explain, quiz, aur chat.
      - show: [prompts, models, "assistant->prompts", "assistant->models"]
        focus: [prompts, models]
        say: >
          Prompts ki apni alag file hai, taaki aap code chhue bina prompts improve kar sako. Aur models mein quiz ka schema hai.
      - show: [pricing, "assistant->pricing"]
        focus: [pricing]
        say: >
          Pricing cost calculate karti hai aur budget enforce karti hai.
      - show: [client, api, fake, "assistant->client", "client->api", "client->fake"]
        focus: [client, api, fake]
        flow: ["client->api", "client->fake"]
        say: >
          Aur client SDK client banata hai. Key set hai toh real client, nahi toh wahi SDK offline fake API ki taraf. Program ke baaki hisse ko yeh fark pata hi nahi chalta.

  - type: callout
    chapter: The offline fake API
    kind: analogy
    title: "The fake API is a flight simulator"
    body: "Pilots train in a simulator with **the real cockpit controls**; only the outside world is simulated. Our tests use **the real SDK**; only the server is simulated. Crashes are free, and you can practise failures on purpose."
    say: >
      Sabse pehle woh cheez jo testing ko possible banati hai: fake API. Isse flight simulator ki tarah socho. Pilots simulator mein real cockpit controls ke saath train karte hain. Sirf bahar ki duniya simulated hoti hai.
      Hamare tests real SDK use karte hain. Sirf server simulated hai. Crash free mein hota hai, aur failures jaan boojhkar practice kar sakte ho.

  - type: code
    heading: "fake_api.py: a fake server the real SDK talks to"
    title: study/fake_api.py
    file: project/ai-study-assistant/study/fake_api.py
    lines: "33-63"
    steps:
      - lines: "33-41"
        note: "A callable handler. `STUDY_FAKE_FAIL` scripts failures."
        say: >
          Yeh ek class hai jiske objects ko function ki tarah call kar sakte ho, har HTTP request par ek baar. Planned failures ki ek list se tests aur demos jaan boojhkar four twenty nine ya five hundred mangwa sakte hain.
      - lines: "43-50"
        note: "It reads the real JSON request the SDK sent."
        say: >
          Har call ko SDK ki banayi hui real HTTP request milti hai, aur woh uska JSON body parse karti hai. Body record hoti hai, taaki tests check kar sakein ki exactly kya bheja gaya.
      - lines: "52-63"
        note: "Same shapes as the real API: errors, refusals, `max_tokens`, streaming."
        say: >
          Phir woh placeholder reply banati hai, planned failure ya refusal lagati hai, real API ki tarah max tokens par reply kaatti hai, aur normal JSON ya server sent events ki stream wapas deti hai.
          Responses ki shape real API jaisi hai, isliye SDK ko fark pata nahi chalta. Matlab hamare tests real SDK code ko test karte hain.

  - type: code
    chapter: Client and settings
    heading: "client.py: real client or offline client"
    title: study/client.py
    file: project/ai-study-assistant/study/client.py
    steps:
      - lines: "16-19"
        note: "Real mode: the SDK reads `ANTHROPIC_API_KEY` itself."
        say: >
          Key hai, toh normal client banta hai. SDK key environment se khud padhta hai, toh key hamare code mein kabhi nahi aati. Hum retry count aur saath second ka timeout dete hain.
      - lines: "20-25"
        note: "Offline: a `MockTransport` replaces the network."
        say: >
          Key nahi hai, toh ek clear offline notice print hota hai, aur wahi SDK ek aise HTTP client ke saath banta hai jiska transport network ki jagah hamari fake API hai.

  - type: code
    title: study/config.py
    file: project/ai-study-assistant/study/config.py
    steps:
      - lines: "15-23"
        note: "No key → offline. Everything else has a safe default."
        say: >
          Settings environment variables se aati hain, Module 1 ki tarah. Key nahi, toh automatically offline mode. Model ka default Claude Opus 5.5 hai, aur budget ka pachaas cents.

  - type: code
    chapter: Costs and budget
    heading: "pricing.py: every call is costed"
    title: study/pricing.py
    file: project/ai-study-assistant/study/pricing.py
    steps:
      - lines: "5-12"
        note: "List prices per million tokens. Check the pricing page; they change."
        say: >
          Price table mein har model ke liye per million input aur output tokens ke dollars hain.
      - lines: "15-19"
        say: >
          Cost USD lesson five wala formula hai. Unknown model par error aata hai, chupchaap zero cost nahi.
      - lines: "22-34"
        note: "`check()` runs **before** each call."
        say: >
          Cost tracker kharcha jodta hai. Iska check method har call se pehle chalta hai, aur budget khatam hote hi budget exceeded raise karta hai. Yahi runaway loop se aapki suraksha hai.
      - lines: "36-40"
        say: >
          Aur add har poori hui call ki cost record karta hai.

  - type: table
    heading: "Dry run: a $0.003 budget, one check before every call"
    columns: [Call, check()  before, Cost of call, Spent after]
    widths: [0.6, 1.6, 1.2, 1.2]
    mono: true
    rows:
      - {cells: ["1", "0.0000 < 0.003 → ok", "0.0013", "0.0013"], say: "Ek chhote budget ke saath dry run. Teen tenth of a cent ka budget. Call one: check, spent zero hai, theek hai. Call ki cost point zero zero one three, spent ab utna hi."}
      - {cells: ["2", "0.0013 < 0.003 → ok", "0.0013", "0.0026"], say: "Call two: check, abhi bhi budget ke andar. Call hui, spent ab point zero zero two six."}
      - {cells: ["3", "0.0026 < 0.003 → ok", "0.0013", "0.0039"], tone: amber, say: "Call three: check pass, kyunki point zero zero two six abhi bhi budget se kam hai. Call ke baad spent budget se thoda upar chala gaya."}
      - {cells: ["4", "0.0039 ≥ 0.003 → stop", "—", "0.0039"], tone: coral, say: "Call four: check fail. BudgetExceeded, aur request bheji hi nahi jaati.", note: "A check before each call can overshoot by at most one call: pick a budget with that margin."}

  - type: code
    chapter: The assistant
    heading: "assistant.py: errors, answers and fallbacks"
    title: study/assistant.py
    file: project/ai-study-assistant/study/assistant.py
    lines: "16-75"
    steps:
      - lines: "20-30"
        note: "An `Answer` carries the text, stop reason, tokens and cost."
        say: >
          Answer ek call se mili har jaankari ko ek saath rakhta hai: text, stop reason, tokens, aur cost. Truncated true hota hai jab reply max tokens par kata.
      - lines: "33-53"
        note: "One place maps SDK errors to clear messages, most specific first."
        say: >
          Friendly errors ek context manager hai jo SDK exceptions ko pakadta hai, sabse specific pehle, aur har ek ko ek clear message mein badalta hai. Yeh lesson five wali error table hai, ek baar likhi, aur har call mein reuse.
      - lines: "16-17"
        note: "Opt in to server-side fallbacks for refusals."
        say: >
          Ab fallbacks. Agar model request mana kar de, toh API usse automatically doosre model par chala sakti hai. Hum iss beta flag se opt in karte hain.
      - lines: "63-65"
        note: "Every request shares the model, the beta flag and `fallbacks`."
        say: >
          Base woh arguments banata hai jo har request mein common hain: model, beta flag, aur fallbacks equals default, taaki API khud suitable fallback model chune.
      - lines: "67-75"
        note: "Record the cost first, then check for a refusal, then read the text."
        say: >
          Answer function ek response ko Answer mein badalta hai. Pehle cost record karta hai, kyunki mana ki gayi request ka bhi bill aata hai. Phir refusal check, aur uske baad hi text blocks jodta hai.

  - type: code
    heading: "explain(): streaming an answer"
    title: study/assistant.py
    file: project/ai-study-assistant/study/assistant.py
    lines: "77-91"
    steps:
      - lines: "81-82"
        say: >
          Explain pehle budget check karta hai, phir prompts dot py se request template bharta hai.
      - lines: "83-86"
        note: "`beta.messages.stream` + shared arguments + low effort."
        say: >
          Friendly errors ke andar ek stream kholta hai, shared arguments, tutor system prompt, aur low effort ke saath. Explanations ke liye low effort kaafi hai.
      - lines: "87-91"
        note: "Each piece goes to `on_text`; the final message is costed."
        say: >
          Har text piece aate hi on text callback ko diya jaata hai. Toh assistant ko farak nahi padta ki text print ho raha hai, web page par dikh raha hai, ya test collect kar raha hai. Phir final message ek Answer banta hai.

  - type: terminal
    chapter: First run
    heading: "First run: explain"
    title: terminal — ai-study-assistant
    cwd: project/ai-study-assistant
    steps:
      - cmd: python -m study explain "Python decorators"
        say: >
          Chalo run karte hain. Pehle offline notice, phir streamed placeholder, phir ek footer jisme model, tokens, cost, aur stop reason hai. Aur aakhir mein budget ke against session ka total.
      - cmd: python -m study explain "recursion" --max-tokens 20
        say: >
          Bahut chhote max tokens ke saath reply kat jaata hai, aur tool aapko warning deta hai, sab theek hone ka natak nahi karta.
      - cmd: STUDY_BUDGET_USD=0 python -m study explain "anything"
        exit: 1
        say: >
          Aur zero budget ke saath, kuch bhi bhejne se pehle hi mana kar deta hai, ek line ke explanation ke saath.

  - type: callout
    chapter: Pause and try
    kind: try
    title: "Pause and try: trace the budget"
    body: "Budget $0.002. Each call costs $0.0013."
    say: >
      Video pause karo aur socho. Budget hai point zero zero two dollars, aur har call point zero zero one three ki.
    items:
      - {text: "How many calls run before BudgetExceeded?", say: "BudgetExceeded se pehle kitni calls chalengi?", pause: 6}
    outro: >
      Do calls. Pehli ke baad spent point zero zero one three, jo budget se kam hai, toh doosri chalti hai. Uske baad spent point zero zero two six, toh teesri ka check fail hota hai.

  - type: recap
    chapter: Recap
    heading: Part 1 recap
    items:
      - {text: "A fake API with the real protocol makes tests free and repeatable", say: "Recap. Real protocol bolne wali fake API tests ko free aur repeatable banati hai."}
      - {text: "One function decides: real client or offline client", say: "Ek function decide karta hai: real client ya offline client."}
      - {text: "Every call is costed; a budget check runs before each call", say: "Har call ki cost lagti hai, aur har call se pehle budget check hota hai."}
      - {text: "Errors are mapped once; fallbacks handle refusals", say: "Errors ek hi jagah map hote hain, aur fallbacks refusals sambhalte hain."}
    outro: >
      Part two mein: structured output se quizzes, history ke saath chat, poora demo, tests, interview corner, aur module quiz.
