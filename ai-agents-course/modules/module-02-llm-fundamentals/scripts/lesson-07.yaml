  - type: title
    chapter: Next up
    kicker: Coming next · Module 3
    title: Prompt Engineering and Structured Outputs
    subtitle: "Instructions, examples, constraints, Pydantic validation, prompt versions and evaluations. Project: an AI Resume Analyzer."
    say: >
      Module 2 complete! Ab aap Python se ek language model ko reliably, sasta, aur testable tareeke se call kar sakte ho.
      Module 3 mein aap aise prompts likhna seekhoge jo consistently kaam karein, Pydantic se har output validate karoge, prompts ko version karoge, aur evaluate karoge, ek AI Resume Analyzer banate hue. Milte hain agle module mein!
