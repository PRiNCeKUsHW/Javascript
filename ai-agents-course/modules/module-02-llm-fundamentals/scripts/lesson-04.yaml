module_title: LLM Fundamentals and API Integration
title: "Controlling Output: Limits, Streaming and Structured JSON"
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 2 · Lesson 4
    title: Controlling the output
    subtitle: Output limits and stop reasons, streaming, structured JSON, and refusals.
    say: >
      Getting a reply is easy. Getting a reply your program can rely on takes more care.
      In this lesson you'll control how long replies are, show them as they're generated, get structured JSON instead of free text, and handle the cases where the model stops early.

  - type: objectives
    items:
      - {text: "Use `max_tokens` and check `stop_reason` every time", say: "You'll use max tokens, and check the stop reason every time."}
      - {text: "Stream replies for a responsive interface", say: "Stream replies for a responsive interface."}
      - {text: "Get validated JSON with structured outputs", say: "Get validated JSON with structured outputs."}
      - {text: "Handle refusals safely", say: "And handle refusals safely."}

  - type: cards
    chapter: Stop reasons
    heading: "stop_reason: why did the reply end?"
    columns: 3
    cards:
      - {tag: end_turn, title: Finished, body: "The model completed its answer", tone: teal, say: "Every response tells you why it ended. End turn means the model finished its answer naturally."}
      - {tag: max_tokens, title: Cut off, body: "It hit your `max_tokens` limit", tone: amber, say: "Max tokens means it hit your limit and was cut off, possibly mid-sentence."}
      - {tag: refusal, title: Declined, body: "It declined, for safety reasons", tone: coral, say: "Refusal means the model declined the request for safety reasons."}
      - {tag: stop_sequence, title: Stop text, body: "It produced one of your stop sequences", tone: blue, say: "Stop sequence means it produced one of the custom stop strings you supplied."}
      - {tag: tool_use, title: Wants a tool, body: "It is asking to run a tool (Module 5)", tone: violet, say: "Tool use means it wants to run one of your tools. That's the heart of agents, in Module 5."}
      - {tag: pause_turn, title: Paused, body: "A long agentic turn paused; continue it", tone: muted, say: "And pause turn means a long agentic turn paused, and you can continue it."}

  - type: code
    chapter: Output limits
    heading: max_tokens is a hard cap, so check stop_reason
    title: limits.py
    file: source/lesson-04/limits.py
    steps:
      - lines: "6-9"
        note: "Same question, two limits: 1,000 tokens and 15 tokens."
        say: >
          We ask the same question twice, once with a generous limit and once with only fifteen tokens.
      - lines: "10-13"
        note: "**Always** check `stop_reason` before trusting the text."
        say: >
          And we check the stop reason. A cut-off reply looks like a normal string, so if you don't check, you'll silently show users half an answer, or try to parse half a JSON document.

  - type: terminal
    title: terminal — lesson-04
    cwd: source/lesson-04
    steps:
      - cmd: python limits.py
        say: >
          With a thousand tokens, end turn. With fifteen, the stop reason is max tokens, and exactly fifteen output tokens were used. The model doesn't plan to fit the limit. It's simply stopped.
    outro: >
      So set max tokens high enough for the job, and treat max tokens as the stop reason that needs handling. Don't lowball it to save money. A truncated answer usually costs you a retry.

  - type: compare
    chapter: Streaming
    heading: Streaming makes waiting feel shorter
    left:
      title: "Without streaming"
      tone: muted
      items:
        - "Request sent… nothing on screen"
        - "Wait for the whole reply"
        - "Everything appears at once"
    right:
      title: "With streaming"
      tone: teal
      items:
        - "Text appears within moments"
        - "Words arrive as they're generated"
        - "Same total time, much better experience"
    steps:
      - show: left
        say: >
          Remember that models generate one token at a time. Without streaming, your program waits for the entire reply, with nothing on screen.
      - show: right
        say: >
          With streaming, the API sends pieces as they're generated, so text appears almost immediately. The total time is the same, but it feels far faster. Streaming also avoids request timeouts on very long replies.

  - type: code
    title: stream.py
    file: source/lesson-04/stream.py
    steps:
      - lines: "6-10"
        note: "`messages.stream(...)` takes the same arguments as `create`."
        say: >
          Messages dot stream takes exactly the same arguments as create, and is used as a context manager with with.
      - lines: "11-12"
        note: "`text_stream` yields text pieces as they arrive."
        say: >
          Text stream yields small pieces of text as they arrive. We print each one immediately, with flush equals True so it isn't held in a buffer.
      - lines: "13"
        note: "`get_final_message()`: the full message, with `stop_reason` and `usage`."
        say: >
          And when the stream ends, get final message gives you the complete message object, with its stop reason and usage, just like create.

  - type: terminal
    title: terminal — lesson-04
    cwd: source/lesson-04
    steps:
      - cmd: python stream.py
        say: >
          In the video the pieces arrive instantly, because the fake API is local, but the code path is the real streaming code: server-sent events, parsed by the SDK.

  - type: compare
    chapter: Structured output
    heading: "Structured output: JSON your code can trust"
    left:
      title: "Asking nicely for JSON"
      tone: coral
      label: Fragile
      items:
        - "\"Please reply in JSON\" in the prompt"
        - "Extra text, wrong keys or broken JSON can slip through"
        - "You write parsing and repair code"
    right:
      title: "Structured outputs"
      tone: teal
      label: Reliable
      items:
        - "You pass a **JSON schema** (or a Pydantic class)"
        - "The reply is constrained to valid JSON for that schema"
        - "The SDK parses it into a Python object"
    steps:
      - show: left
        say: >
          Agents constantly need machine-readable output: a quiz, a plan, a tool decision. Just asking for JSON in the prompt is fragile. Extra words, wrong keys, or broken JSON can slip through.
      - show: right
        say: >
          Structured outputs fix this. You pass a JSON schema, and the API constrains the reply to valid JSON for that schema. With a Pydantic class, the SDK builds the schema and parses the reply into a Python object for you.

  - type: code
    title: structured.py
    file: source/lesson-04/structured.py
    steps:
      - lines: "7-16"
        note: "A Pydantic `BaseModel` describes the shape. Module 3 goes deeper."
        say: >
          First, describe the shape with Pydantic classes: a question has text, four options, the index of the right answer, and an explanation. A quiz has a topic and a list of questions.
          Pydantic gets a full lesson in Module 3. For now, read these as typed dataclasses.
      - lines: "9-10"
        note: "Limits the API can't enforce move into the schema's description; the SDK checks them afterwards."
        say: >
          These Field constraints say exactly four options and an index from zero to three. The API's schema support is limited, so the SDK moves those limits into the field descriptions, and then checks them itself when the reply arrives.
      - lines: "19-26"
        note: "`messages.parse(..., output_format=Quiz)`"
        say: >
          Then call messages dot parse instead of create, with output format set to the class.
      - lines: "27-30"
        note: "`parsed_output` is a validated `Quiz` object."
        say: >
          Parsed output is a real, validated Quiz object, so you use attributes instead of digging through dictionaries.

  - type: terminal
    title: terminal — lesson-04
    cwd: source/lesson-04
    steps:
      - cmd: python structured.py
        say: >
          The offline fake returns schema-valid placeholder questions, and they come back as a real Quiz object. If a reply doesn't fit the schema, the SDK raises a validation error instead of handing you bad data.

  - type: callout
    chapter: Refusals
    kind: warn
    title: "Refusals: check before you read"
    body: "If `stop_reason` is `\"refusal\"`, the model declined and the content may be empty. Check it **before** reading the text. Optionally, the API can automatically retry a declined request on another model (`fallbacks`), which our project turns on."
    say: >
      Last case: refusals. If the stop reason is refusal, the model declined the request for safety reasons, and the content may be empty. So check the stop reason before you read the text.
      On current models, the API can also automatically re-run a declined request on another model, a feature called fallbacks. Our project turns it on, and you'll see the code in lesson six.

  - type: quiz
    chapter: Quick check
    number: 1
    question: "Your code parses `response.content[0].text` as JSON and it fails on a long reply. What should you check first?"
    options:
      - "The API key"
      - "Whether `stop_reason` is `max_tokens`"
      - "The temperature setting"
      - "The Python version"
    answer: 1
    explain: "A reply cut off at `max_tokens` ends mid-JSON. Check `stop_reason`, raise the limit, or ask for less."
    say_question: >
      Quick check. Your code parses the reply as JSON, and it fails on a long reply. What should you check first?
    say_answer: >
      Whether the stop reason is max tokens. A cut-off reply ends in the middle of the JSON.

  - type: recap
    chapter: Recap
    heading: Lesson 4 recap
    items:
      - {text: "`stop_reason` tells you if the reply is complete. Check it.", say: "The stop reason tells you whether the reply is complete. Always check it."}
      - {text: "`messages.stream` + `text_stream` for responsive output", say: "Stream for responsive output."}
      - {text: "`messages.parse(output_format=Model)` for validated JSON", say: "Use structured outputs, with messages dot parse, for validated JSON."}
      - {text: "Handle `refusal` before reading content", say: "And handle refusals before reading the content."}
    outro: >
      Next lesson: production basics. API keys, errors, rate limits, retries, and what it all costs.
