      - {title: Python threading, url: docs.python.org/3/library/threading.html}
      - {title: Python SDK, url: github.com/anthropics/anthropic-sdk-python}
    say: >
      These are the official documentation pages for this module. Links are in the description, along with the full source code, and the course glossary.

  - type: title
    chapter: Next up
    kicker: Coming next · Module 6
    title: Agent Memory and Conversation State
    subtitle: "Short-term and long-term memory, summaries, and saving state between sessions. Project: a Persistent AI Study Companion."
    say: >
      That's Module 5 complete. Your agent can now use many tools, check every input, survive slow tools, and ask before it does anything dangerous.
      In Module 6, we give agents memory: what to remember, what to forget, and how to pick up a conversation the next day. See you there.
